name: scratch-reenqueue
# t/4567 live-fire scaffold: FM3's re-enqueue-on-infra-failure, simplified. A "failure.marker"
# file in the PR's diff simulates an infra-classified failure (abnormalEnd=true) vs a real
# one; ci-gate's own exit code stays green either way so merge_group completion always fires,
# then this step decides whether the FAILURE was infra or real from that marker file.
on:
  workflow_run:
    workflows: [scratch-ci]
    types: [completed]

jobs:
  re-enqueue-infra-failures:
    if: github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    # Live-fire finding: enqueuePullRequest returned "Resource not accessible by
    # integration" with contents:read/pull-requests:read -- trying pull-requests:write.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the infra-classification artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: infra-classify
          path: classify
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Decide and enumerate
        id: enumerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f classify/verdict.json ] || [ "$(jq -r .abnormalEnd classify/verdict.json)" != "true" ]; then
            echo "not infra-classified -- nothing to do."
            echo "numbers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x get-merge-group-prs.sh
          PRS_JSON=$(./get-merge-group-prs.sh \
            "${{ github.repository }}" \
            "${{ github.event.workflow_run.head_branch }}")
          echo "group PRs: $PRS_JSON"
          NUMBERS=$(echo "$PRS_JSON" | jq -r '[.[].number] | join(",")')
          echo "numbers=$NUMBERS" >> "$GITHUB_OUTPUT"

      - name: Re-enqueue each PR once, pinned
        if: steps.enumerate.outputs.numbers != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR_NUMBERS: ${{ steps.enumerate.outputs.numbers }}
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const numbers = process.env.PR_NUMBERS.split(',').map(Number).filter(Boolean);
            for (const num of numbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: num });
              try {
                await github.graphql(
                  `mutation($prId: ID!, $headSha: GitObjectID!) { enqueuePullRequest(input: { pullRequestId: $prId, expectedHeadOid: $headSha }) { mergeQueueEntry { position } } }`,
                  { prId: pr.node_id, headSha: pr.head.sha }
                );
                console.log(`Re-enqueued PR #${num} pinned to ${pr.head.sha}`);
              } catch (e) {
                console.log(`::warning::re-enqueue of PR #${num} failed: ${e.message}`);
              }
            }
