name: scratch-reenqueue
# t/4567 live-fire scaffold: FM3's re-enqueue-on-infra-failure, simplified. A "failure.marker"
# file in the PR's diff simulates an infra-classified failure (abnormalEnd=true) vs a real
# one; ci-gate's own exit code stays green either way so merge_group completion always fires,
# then this step decides whether the FAILURE was infra or real from that marker file.
#
# SO F1/F2 fixes (e/375#2, t/4567#33): pin to the entry's tested headSha (not the PR's
# current head), and persist a per-PR/per-head marker comment so a repeat infra failure on
# the SAME head does not re-enqueue again -- it escalates instead.
on:
  workflow_run:
    workflows: [scratch-ci]
    types: [completed]

jobs:
  re-enqueue-infra-failures:
    if: github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the infra-classification artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: infra-classify
          path: classify
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Decide and enumerate
        id: enumerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f classify/verdict.json ] || [ "$(jq -r .abnormalEnd classify/verdict.json)" != "true" ]; then
            echo "not infra-classified -- nothing to do."
            echo "prs_json=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x get-merge-group-prs.sh
          PRS_JSON=$(./get-merge-group-prs.sh \
            "${{ github.repository }}" \
            "${{ github.event.workflow_run.head_branch }}")
          echo "group PRs: $PRS_JSON"
          echo "prs_json=$(echo "$PRS_JSON" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Re-enqueue each PR once per head, and log it
        if: steps.enumerate.outputs.prs_json != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PRS_JSON_B64: ${{ steps.enumerate.outputs.prs_json }}
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const entries = JSON.parse(Buffer.from(process.env.PRS_JSON_B64, 'base64').toString('utf8'));
            const MARKER = (sha) => `<!-- t4567-fm3-reenqueue:${sha} -->`;

            const reenqueued = [];
            const alreadyTried = [];
            for (const entry of entries) {
              const num = entry.number;
              const headSha = entry.headSha;
              if (!headSha) {
                console.log(`::warning::PR #${num}: no headSha -- skipping.`);
                continue;
              }
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: num, per_page: 100 });
              if (comments.some(c => c.body && c.body.includes(MARKER(headSha)))) {
                console.log(`PR #${num} @ ${headSha}: already attempted once for this exact head -- NOT re-enqueuing again (F2).`);
                alreadyTried.push({ num, headSha });
                continue;
              }
              try {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: num });
                await github.graphql(
                  `mutation($prId: ID!, $headSha: GitObjectID!) { enqueuePullRequest(input: { pullRequestId: $prId, expectedHeadOid: $headSha }) { mergeQueueEntry { position } } }`,
                  { prId: pr.node_id, headSha }
                );
                await github.rest.issues.createComment({ owner, repo, issue_number: num, body: `${MARKER(headSha)}\nAuto re-enqueued once (t/4567 FM3 scaffold).` });
                reenqueued.push({ num, headSha });
                console.log(`Re-enqueued PR #${num} pinned to ${headSha}`);
              } catch (e) {
                console.log(`::warning::re-enqueue of PR #${num} @ ${headSha} failed: ${e.message}`);
              }
            }

            if (alreadyTried.length) {
              const created = await github.rest.issues.create({
                owner, repo,
                title: `CI infra re-enqueue exhausted: ${alreadyTried.map(r => `#${r.num}`).join(', ')}`,
                body: `Repeat infra-classified failure on an already-retried head. NOT re-enqueuing again. PR(s): ${alreadyTried.map(r => `#${r.num}@${r.headSha.slice(0, 7)}`).join(', ')}`,
                labels: [],
              });
              console.log(`::warning::Created escalation issue #${created.data.number}`);
            }
            if (reenqueued.length) {
              console.log(`Re-enqueued: ${reenqueued.map(r => `#${r.num}`).join(', ')}`);
            }
