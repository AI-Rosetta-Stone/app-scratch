name: scratch-reenqueue
# t/4567 live-fire scaffold: FM3's infra-failure handler, REVISED (TL ruling t/4567#37-39).
# Automatic re-enqueue is REMOVED entirely -- enqueuePullRequest called with github.token
# never triggers a new merge_group check run (GitHub doesn't start workflows for
# GITHUB_TOKEN-caused events), so a re-enqueued entry silently never gets checked and
# times out. This job now only ALERTS on an infra-classified failure, naming the dequeued
# PR(s) and the head(s) that were in the failed group -- arm 5a.
on:
  workflow_run:
    workflows: [scratch-ci]
    types: [completed]

jobs:
  alert-infra-failures:
    if: github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the infra-classification artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: infra-classify
          path: classify
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Decide and enumerate
        id: enumerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f classify/verdict.json ] || [ "$(jq -r .abnormalEnd classify/verdict.json)" != "true" ]; then
            echo "not infra-classified -- nothing to do."
            echo "prs_json=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x get-merge-group-prs.sh
          PRS_JSON=$(./get-merge-group-prs.sh \
            "${{ github.repository }}" \
            "${{ github.event.workflow_run.head_branch }}")
          echo "group PRs: $PRS_JSON"
          echo "prs_json=$(echo "$PRS_JSON" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: File the alert-escalated issue
        if: steps.enumerate.outputs.prs_json != ''
        uses: actions/github-script@v7
        env:
          PRS_JSON_B64: ${{ steps.enumerate.outputs.prs_json }}
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const entries = JSON.parse(Buffer.from(process.env.PRS_JSON_B64, 'base64').toString('utf8'));
            const list = entries.map(e => `#${e.number}@${(e.headSha || 'unknown').slice(0, 7)}`).join(', ');
            const created = await github.rest.issues.create({
              owner, repo,
              title: `Infra-classified merge_group failure: ${entries.map(e => `#${e.number}`).join(', ')}`,
              body: `**Infra-classified merge_group failure (t/4567 FM3, alert-only, arm 5a).** PR(s) dequeued: ${list}. No automatic re-enqueue (GITHUB_TOKEN enqueues never trigger a merge_group check).`,
              labels: [],
            });
            console.log(`Created alert issue #${created.data.number} for: ${list}`);
