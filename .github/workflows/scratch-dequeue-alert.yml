name: scratch-dequeue-alert
# t/4567 D1 live-fire scaffold -- mirrors merge-queue-dequeue-alert.yml.
on:
  pull_request:
    types: [dequeued]

permissions:
  issues: write

jobs:
  alert-on-unexpected-dequeue:
    # t/4567 D1 live-fire finding: the reason lives at github.event.reason (top level of
    # the dequeued payload), NOT github.event.pull_request.merge_queue_dequeue_reason --
    # confirmed via a payload dump (reason: "MERGE" on a clean merge).
    if: github.event.reason != 'MERGE' && github.event.reason != 'MANUAL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // t/4567 SO L3' (e/392#6/#7): APPEND-ONLY, static body, dup-race on create.
            const owner = context.repo.owner, repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const reason = context.payload.reason || 'unknown';
            const shortSha = pr.head.sha.slice(0, 7);
            const entryLine = `- PR #${pr.number} @ \`${shortSha}\` (reason: \`${reason}\`) -- ${pr.html_url}`;
            const BATCH_LABEL = 'merge-queue-dequeue-batch';
            const WINDOW_MS = 15 * 60 * 1000;
            const now = Date.now();

            const { data: candidates } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: BATCH_LABEL, sort: 'created', direction: 'desc', per_page: 5,
            });
            const batchIssue = candidates.find(i => (now - new Date(i.created_at).getTime()) < WINDOW_MS);

            if (batchIssue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: batchIssue.number, body: entryLine });
              console.log(`Appended PR #${pr.number} to existing batch dequeue issue #${batchIssue.number} (reason: ${reason})`);
              return;
            }

            const body = `**Merge-queue dequeue batch (t/4567 D1 scaffold).** Some of these may be collateral; re-arm each one pinned to its own head.`;
            const created = await github.rest.issues.create({
              owner, repo,
              title: `Merge-queue dequeue batch (t/4567 D1), starting PR #${pr.number}`,
              body,
              labels: [BATCH_LABEL],
            });
            await github.rest.issues.createComment({ owner, repo, issue_number: created.data.number, body: entryLine });
            console.log(`Created batch dequeue issue #${created.data.number} for PR #${pr.number} (reason: ${reason})`);

            const { data: recheck } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: BATCH_LABEL, sort: 'created', direction: 'desc', per_page: 5,
            });
            const overlapping = recheck.filter(i => (now - new Date(i.created_at).getTime()) < WINDOW_MS);
            const canonical = overlapping.reduce((a, b) => (a.number < b.number ? a : b), created.data);
            if (canonical.number !== created.data.number) {
              await github.rest.issues.createComment({ owner, repo, issue_number: canonical.number, body: entryLine });
              await github.rest.issues.update({ owner, repo, issue_number: created.data.number, state: 'closed' });
              await github.rest.issues.createComment({
                owner, repo, issue_number: created.data.number,
                body: `Dup of #${canonical.number} -- redirected there.`,
              });
              console.log(`Create-race: closed duplicate #${created.data.number} as dup of #${canonical.number}`);
            }
