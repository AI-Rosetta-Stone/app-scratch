name: CodeQL SAST

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# t/4567 TL design (t/4567#71): same concurrency scoping as scratch-ci.yml -- only the
# merge_group tier shares a cancellable group key, so CodeQL also runs once per batch.
concurrency:
  group: ${{ github.event_name == 'merge_group' && format('merge-queue-ci-{0}', github.workflow) || format('pr-ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
